<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pokémon TCG AI - Game Board</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --hp-color: #22c55e;
      --p1-color: #3b82f6;
      --p2-color: #f59e0b;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      background: var(--bg);
      color: #f8fafc;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }

    /* Estilo da Mesa TCG */
    .tcg-board {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .player-zone {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 2px solid #334155;
      position: relative;
    }

    .player-zone.active-turn {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    .zone-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .play-area {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .active-spot {
      flex: 1;
      background: #0f172a;
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      min-height: 90px;
    }

    .bench-spot {
      flex: 2;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 10px;
      min-height: 90px;
    }

    .pokemon-card {
      background: #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      min-width: 90px;
      text-align: center;
    }

    .hp-bar-bg {
      background: #475569;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-bar-fill {
      background: var(--hp-color);
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }

    .stats-badge {
      font-size: 12px;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* Grid Inferior: Ações e Logs */
    .dashboard-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card-box {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .log-box {
      height: 200px;
      overflow-y: auto;
      background: #020617;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
    }

    .action-tag {
      background: #0f172a;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2 style="margin:0;">Simulador Pokémon TCG AI</h2>
      <small id="turn-display" style="color: #94a3b8;">Aguardando início da partida</small>
    </div>
    <div>
      <button class="btn" onclick="startGame()">Nova Partida</button>
      <button class="btn" onclick="stepTurn()">Avançar 1 Turno</button>
      <button class="btn" onclick="autoRun()">Auto Play</button>
    </div>
  </div>

  <!-- Mesa de Jogo (TCG Board) -->
  <div class="tcg-board">
    <!-- Jogador 2 (Random / Oponente) -->
    <div class="player-zone" id="zone-p2">
      <div class="zone-title">
        <span style="color: var(--p2-color);">Random Agent (P2)</span>
        <div>
          <span class="stats-badge">Prêmios Restantes: <b id="p2-prizes">-</b></span>
          <span class="stats-badge">Mão: <b id="p2-hand">-</b></span>
          <span class="stats-badge">Deck: <b id="p2-deck">-</b></span>
        </div>
      </div>
      <div class="play-area">
        <div class="active-spot">
          <small style="color: #94a3b8;">Pokémon Ativo</small>
          <div id="p2-active-card">Vazio</div>
        </div>
        <div class="bench-spot">
          <small style="color: #94a3b8; display: block; width: 100%;">Banco</small>
          <div id="p2-bench-cards" style="display: flex; gap: 8px;">Vazio</div>
        </div>
      </div>
    </div>

    <!-- Jogador 1 (Rule-Based) -->
    <div class="player-zone" id="zone-p1">
      <div class="zone-title">
        <span style="color: var(--p1-color);">Rule-Based Agent (P1)</span>
        <div>
          <span class="stats-badge">Prêmios Restantes: <b id="p1-prizes">-</b></span>
          <span class="stats-badge">Mão: <b id="p1-hand">-</b></span>
          <span class="stats-badge">Deck: <b id="p1-deck">-</b></span>
        </div>
      </div>
      <div class="play-area">
        <div class="active-spot">
          <small style="color: #94a3b8;">Pokémon Ativo</small>
          <div id="p1-active-card">Vazio</div>
        </div>
        <div class="bench-spot">
          <small style="color: #94a3b8; display: block; width: 100%;">Banco</small>
          <div id="p1-bench-cards" style="display: flex; gap: 8px;">Vazio</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Painel Inferior -->
  <div class="dashboard-bottom">
    <div class="card-box">
      <h4 style="margin-top: 0;">Ações Legais do Turno Atual:</h4>
      <div id="actions-container" style="max-height: 180px; overflow-y: auto;">-</div>
    </div>
    <div class="card-box">
      <h4 style="margin-top: 0;">Log de Ações em Tempo Real:</h4>
      <div class="log-box" id="logs"></div>
    </div>
  </div>

  <script>
    let autoInterval = null;

    async function startGame() {
      if (autoInterval) clearInterval(autoInterval);
      const res = await fetch('/api/start', { method: 'POST' });
      const data = await res.json();
      render(data);
    }

    async function stepTurn() {
      const res = await fetch('/api/step', { method: 'POST' });
      const data = await res.json();
      render(data);
      if (data.is_terminal && autoInterval) clearInterval(autoInterval);
    }

    function autoRun() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(async () => {
        const res = await fetch('/api/state');
        const data = await res.json();
        if (data.is_terminal || !data.active) {
          clearInterval(autoInterval);
        } else {
          await stepTurn();
        }
      }, 400);
    }

    function createPokemonCardHTML(pkmn) {
      if (!pkmn) return '<em>Nenhum</em>';
      const hpPercent = Math.max(0, (pkmn.hp / pkmn.max_hp) * 100);
      return `
        <div class="pokemon-card">
          <b>ID: ${pkmn.id}</b>
          <div>HP: ${pkmn.hp}/${pkmn.max_hp}</div>
          <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${hpPercent}%;"></div></div>
          <small>⚡ Energias: ${pkmn.energies}</small>
        </div>
      `;
    }

    function render(data) {
      if (!data.active) return;

      document.getElementById('turn-display').innerText = data.is_terminal 
        ? `Fim de Jogo! Vencedor: ${data.winner === 0 ? 'Rule-Based (P1)' : 'Random (P2)'}` 
        : `Turno ${data.turn} | Vez de: ${data.current_player_name}`;

      // Borda do jogador do turno
      document.getElementById('zone-p1').classList.toggle('active-turn', data.current_player === 0);
      document.getElementById('zone-p2').classList.toggle('active-turn', data.current_player === 1);

      // Renderiza Jogador 0 (P1)
      if (data.board && data.board[0]) {
        const p1 = data.board[0];
        document.getElementById('p1-prizes').innerText = p1.prizes;
        document.getElementById('p1-hand').innerText = p1.hand_count;
        document.getElementById('p1-deck').innerText = p1.deck_count;
        document.getElementById('p1-active-card').innerHTML = createPokemonCardHTML(p1.active);
        document.getElementById('p1-bench-cards').innerHTML = p1.bench.map(createPokemonCardHTML).join('') || '<em>Banco Vazio</em>';
      }

      // Renderiza Jogador 1 (P2)
      if (data.board && data.board[1]) {
        const p2 = data.board[1];
        document.getElementById('p2-prizes').innerText = p2.prizes;
        document.getElementById('p2-hand').innerText = p2.hand_count;
        document.getElementById('p2-deck').innerText = p2.deck_count;
        document.getElementById('p2-active-card').innerHTML = createPokemonCardHTML(p2.active);
        document.getElementById('p2-bench-cards').innerHTML = p2.bench.map(createPokemonCardHTML).join('') || '<em>Banco Vazio</em>';
      }

      // Ações legíveis
      const actionsContainer = document.getElementById('actions-container');
      actionsContainer.innerHTML = (data.legal_actions || []).map(a => `<div class="action-tag">${a}</div>`).join('');

      // Logs
      const logs = document.getElementById('logs');
      logs.innerHTML = data.logs.map(l => `<div>> ${l}</div>`).join('');
      logs.scrollTop = logs.scrollHeight;
    }
  </script>
</body>
</html>
